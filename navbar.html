<style>
.navbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 1rem 2rem;
    background: #ffffff;
    box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    position: sticky;
    top: 0;
    z-index: 1000;
    transition: all 0.3s ease;
}

.nav-logo {
    display: flex;
    align-items: center;
    text-decoration: none;
    font-weight: 800;
    font-size: 1.5rem;
    color: #2c3e50;
    z-index: 1002;
}

.nav-logo img {
    height: 32px;
    margin-right: 10px;
}

.nav-links {
    display: flex;
    align-items: center;
    gap: 1.2rem;
    list-style: none;
    margin: 0;
    padding: 0;
}

.nav-links a {
    text-decoration: none;
    color: #2c3e50;
    font-weight: 500;
    padding: 0.5rem 1rem;
    border-radius: 8px;
    transition: all 0.3s ease;
    position: relative;
}

.nav-links a:hover {
    background-color: #f8f9fa;
    color: #3498db;
    transform: translateY(-2px);
}

.nav-links a::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 50%;
    width: 0;
    height: 2px;
    background: #3498db;
    transition: all 0.3s ease;
    transform: translateX(-50%);
}

.nav-links a:hover::after {
    width: 80%;
}

/* Mobile Menu Toggle */
.mobile-menu-toggle {
    display: none;
    flex-direction: column;
    cursor: pointer;
    padding: 0.5rem;
    z-index: 1002;
    background: none;
    border: none;
    position: relative;
}

.mobile-menu-toggle span {
    width: 25px;
    height: 3px;
    background-color: #2c3e50;
    margin: 3px 0;
    transition: all 0.3s ease;
    border-radius: 2px;
    display: block;
}

.mobile-menu-toggle.active span:nth-child(1) {
    transform: rotate(-45deg) translate(-5px, 6px);
    background-color: #ffffff;
}

.mobile-menu-toggle.active span:nth-child(2) {
    opacity: 0;
}

.mobile-menu-toggle.active span:nth-child(3) {
    transform: rotate(45deg) translate(-5px, -6px);
    background-color: #ffffff;
}

/* Mobile Menu Overlay */
.mobile-menu-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.6);
    z-index: 999;
    opacity: 0;
    visibility: hidden;
    transition: all 0.4s ease;
    backdrop-filter: blur(5px);
}

.mobile-menu-overlay.show {
    opacity: 1;
    visibility: visible;
}

/* Mobile Menu Styles */
@media (max-width: 768px) {
    .navbar {
        padding: 1rem 1.5rem;
    }
    
    .nav-logo {
        font-size: 1.3rem;
        position: relative;
        z-index: 1002;
    }
    
    .nav-logo img {
        height: 28px;
    }
    
    .mobile-menu-toggle {
        display: flex;
    }
    
    .nav-links {
        position: fixed;
        top: 0;
        right: -100%;
        width: 100%;
        height: 100vh;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 0;
        box-shadow: none;
        transition: right 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        z-index: 1001;
        gap: 0;
        overflow: hidden;
    }
    
    .nav-links.show {
        right: 0;
    }
    
    .nav-links::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: linear-gradient(45deg, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0.05) 100%);
        pointer-events: none;
    }
    
    .nav-links a {
        padding: 1.5rem 2rem;
        margin: 0.5rem 0;
        border-radius: 15px;
        font-size: 1.3rem;
        font-weight: 600;
        color: #ffffff;
        display: block;
        width: 80%;
        max-width: 300px;
        text-align: center;
        position: relative;
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.2);
        transition: all 0.3s ease;
        transform: translateX(100px);
        opacity: 0;
    }
    
    .nav-links.show a {
        transform: translateX(0);
        opacity: 1;
    }
    
    .nav-links.show a:nth-child(1) { transition-delay: 0.1s; }
    .nav-links.show a:nth-child(2) { transition-delay: 0.2s; }
    .nav-links.show a:nth-child(3) { transition-delay: 0.3s; }
    .nav-links.show a:nth-child(4) { transition-delay: 0.4s; }
    .nav-links.show a:nth-child(5) { transition-delay: 0.5s; }
    .nav-links.show a:nth-child(6) { transition-delay: 0.6s; }
    .nav-links.show a:nth-child(7) { transition-delay: 0.7s; }
    
    .nav-links a::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: linear-gradient(45deg, rgba(255,255,255,0.1), rgba(255,255,255,0.05));
        border-radius: 15px;
        opacity: 0;
        transition: all 0.3s ease;
        z-index: -1;
    }
    
    .nav-links a:hover {
        background: rgba(255, 255, 255, 0.2);
        transform: translateY(-5px) scale(1.05);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        border-color: rgba(255, 255, 255, 0.4);
    }
    
    .nav-links a:hover::before {
        opacity: 1;
    }
    
    .nav-links a::after {
        display: none;
    }
    
    /* Add floating particles effect */
    .nav-links::after {
        content: '';
        position: absolute;
        width: 100%;
        height: 100%;
        background-image: 
            radial-gradient(circle at 20% 80%, rgba(255,255,255,0.1) 2px, transparent 2px),
            radial-gradient(circle at 80% 20%, rgba(255,255,255,0.1) 2px, transparent 2px),
            radial-gradient(circle at 40% 40%, rgba(255,255,255,0.1) 1px, transparent 1px);
        background-size: 100px 100px, 120px 120px, 80px 80px;
        animation: float 20s infinite linear;
        pointer-events: none;
    }
    
    @keyframes float {
        0% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-20px) rotate(180deg); }
        100% { transform: translateY(0px) rotate(360deg); }
    }
    
    /* Logo animation when menu is open */
    .navbar.menu-open .nav-logo {
        color: #ffffff;
    }
    
    /* Close button styling */
    .nav-links .close-btn {
        position: absolute;
        top: 2rem;
        right: 2rem;
        background: rgba(255, 255, 255, 0.2);
        border: 2px solid rgba(255, 255, 255, 0.3);
        border-radius: 50%;
        width: 50px;
        height: 50px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: all 0.3s ease;
        backdrop-filter: blur(10px);
    }
    
    .nav-links .close-btn:hover {
        background: rgba(255, 255, 255, 0.3);
        transform: scale(1.1);
    }
    
    .nav-links .close-btn::before,
    .nav-links .close-btn::after {
        content: '';
        position: absolute;
        width: 20px;
        height: 2px;
        background: #ffffff;
        border-radius: 1px;
    }
    
    .nav-links .close-btn::before {
        transform: rotate(45deg);
    }
    
    .nav-links .close-btn::after {
        transform: rotate(-45deg);
    }
}

/* Small mobile devices */
@media (max-width: 480px) {
    .navbar {
        padding: 0.8rem 1rem;
    }
    
    .nav-logo {
        font-size: 1.2rem;
    }
    
    .nav-logo img {
        height: 24px;
        margin-right: 8px;
    }
    
    .nav-links a {
        font-size: 1.2rem;
        padding: 1.2rem 1.5rem;
        width: 90%;
    }
}

/* Tablet styles */
@media (max-width: 1024px) and (min-width: 769px) {
    .navbar {
        padding: 1rem 1.5rem;
    }
    
    .nav-links {
        gap: 0.8rem;
    }
    
    .nav-links a {
        padding: 0.4rem 0.8rem;
        font-size: 0.95rem;
    }
}
</style>

    <a href="index.html" class="nav-logo">
        <img src="assets/icon.png" alt="Logo"> BinaryTree
    </a>
    
    <div class="nav-links" id="navLinks">
        <a href="index.html">Home</a>
        <a href="mission.html">Mission</a>
        <a href="team.html">Team</a>
        <a href="ide.html">Python IDE</a>
        <a href="ai-chat.html">AI Chat</a>
        <a href="partners.html">Partners</a>
        <a href="news.html">News</a>
    </div>
    
    <button class="mobile-menu-toggle" id="mobileMenuToggle">
        <span></span>
        <span></span>
        <span></span>
    </button>
</nav>

<div class="mobile-menu-overlay" id="mobileMenuOverlay"></div>
