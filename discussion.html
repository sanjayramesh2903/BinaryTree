<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Discussion - BinaryTree</title>
  <link rel="icon" href="assets/icon.png">

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>

  <style>
    :root {
      --primary: #3a86ff;
      --secondary: #8338ec;
      --accent: #ff006e;
      --background: #f8f9fa;
      --text: #1a1a1a;
      --radius-lg: 0.75rem;
      --shadow-lg: 0 10px 20px rgba(0, 0, 0, 0.15);
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Outfit', sans-serif;
      background-color: var(--background);
      margin: 0;
      padding: 0;
      color: var(--text);
    }

    .navbar {
      background-color: white;
      padding: 1rem 2rem;
      box-shadow: var(--shadow-lg);
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .nav-content {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .nav-logo {
      font-weight: 700;
      font-size: 1.5rem;
      color: var(--primary);
      text-decoration: none;
    }

    .small-logo {
      width: 40px;
      margin-right: 1rem;
    }

    .nav-links {
      display: flex;
      gap: 1rem;
    }

    .nav-links a {
      text-decoration: none;
      color: var(--text);
      font-weight: 500;
    }

    .mobile-nav-toggle {
      display: none;
      background: none;
      border: none;
    }

    .discussion-board {
      padding: 2rem;
      max-width: 800px;
      margin: auto;
    }

    .section h1 {
      text-align: center;
      font-size: 2.5rem;
      margin-bottom: 2rem;
    }

    .discussion-form {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .discussion-form input,
    .discussion-form textarea {
      padding: 1rem;
      border-radius: var(--radius-lg);
      border: 1px solid #ccc;
      font-family: 'Outfit', sans-serif;
      font-size: 1rem;
    }

    .discussion-form button {
      padding: 1rem;
      background: var(--primary);
      color: white;
      font-weight: 600;
      border: none;
      border-radius: var(--radius-lg);
      cursor: pointer;
    }

    .discussion-post {
      background: white;
      padding: 1rem;
      margin-bottom: 1rem;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
    }

    .discussion-post h3 {
      margin: 0 0 0.5rem;
      font-size: 1.25rem;
      color: var(--secondary);
    }

    .discussion-post p {
      margin: 0 0 1rem;
    }

    .discussion-post .actions {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 0.5rem;
    }

    .discussion-post .actions button {
      padding: 0.5rem 1rem;
      border: none;
      background-color: var(--accent);
      color: white;
      font-weight: 600;
      border-radius: var(--radius-lg);
      cursor: pointer;
    }

    .discussion-post .reply-form textarea {
      width: 100%;
      padding: 0.75rem;
      border-radius: var(--radius-lg);
      border: 1px solid #ccc;
      margin-bottom: 0.5rem;
      resize: vertical;
    }

    .discussion-post .reply-form button {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 0.5rem 1rem;
      font-weight: 600;
      border-radius: var(--radius-lg);
    }

    .replies {
      margin-top: 1rem;
      padding-left: 1rem;
      border-left: 2px solid var(--primary);
    }

    .reply {
      margin-bottom: 0.5rem;
      padding: 0.5rem;
      background: #f1f3f5;
      border-radius: var(--radius-lg);
    }

    footer {
      padding: 2rem;
      background-color: white;
      text-align: center;
      box-shadow: 0 -5px 10px rgba(0, 0, 0, 0.05);
      margin-top: 2rem;
    }

    footer p {
      margin: 0;
      font-weight: 400;
      color: #666;
    }

    @media (max-width: 768px) {
      .nav-links {
        display: none;
        flex-direction: column;
        gap: 1rem;
        background: white;
        position: absolute;
        top: 60px;
        right: 2rem;
        padding: 1rem;
        box-shadow: var(--shadow-lg);
      }

      .nav-links[data-visible="true"] {
        display: flex;
      }

      .mobile-nav-toggle {
        display: block;
      }
    }
  </style>
</head>
<body>

  <nav class="navbar">
    <div class="nav-content">
      <img src="assets/icon.png" alt="small-logo" class="small-logo">
      <a href="index.html" class="nav-logo">BinaryTree</a>
      <button class="mobile-nav-toggle" aria-controls="primary-navigation" aria-expanded="false">
        <svg class="icon-hamburger" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        <svg class="icon-close" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        <span class="sr-only">Menu</span>
      </button>
      <div class="nav-links" data-visible="false">
        <a href="index.html">Home</a>
        <a href="mission.html">Mission</a>
        <a href="team.html">Team</a>
        <a href="ide.html">Python IDE</a>
        <a href="ai-chat.html">AI Chat</a>
        <a href="discussion.html">Discussion</a>
      </div>
    </div>
  </nav>

  <main class="discussion-board content">
    <section class="section" id="discussion">
      <h1 data-aos="fade-down">Discussion Board</h1>
      <form class="discussion-form" id="postForm">
        <input type="text" id="topic" placeholder="Topic Heading" required />
        <textarea id="description" rows="4" placeholder="Topic Description" required></textarea>
        <button type="submit">Post Topic</button>
      </form>
      <div id="discussionContainer"></div>
    </section>
  </main>

  <footer>
    <div class="footer-content" data-aos="fade-up">
      <p>&copy; 2025 BinaryTree. All rights reserved.</p>
    </div>
  </footer>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-analytics-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <script>
    // Your Firebase config copied exactly
    const firebaseConfig = {
      apiKey: "AIzaSyBJs48_Ed_yJkMx9wqBFIinC-m4uf7yEQU",
      authDomain: "discussion-ac97b.firebaseapp.com",
      projectId: "discussion-ac97b",
      storageBucket: "discussion-ac97b.firebasestorage.app",
      messagingSenderId: "828172916370",
      appId: "1:828172916370:web:60758965578789974c384b",
      measurementId: "G-7S2SQNVCYP"
    };

    // Initialize Firebase
    firebase.initializeApp(firebaseConfig);
    firebase.analytics();

    // Initialize Firestore
    const db = firebase.firestore();
  </script>

  <script>
    // Your existing JavaScript exactly as given
    const discussionForm = document.getElementById("postForm");
    const discussionContainer = document.getElementById("discussionContainer");

    // Helper: Create discussion post element from data object
    function createDiscussionPost(post) {
      const postElement = document.createElement("div");
      postElement.classList.add("discussion-post");

      // Main content
      const heading = document.createElement("h3");
      heading.textContent = post.topic;

      const description = document.createElement("p");
      description.textContent = post.description;

      postElement.appendChild(heading);
      postElement.appendChild(description);

      // Actions (upvote, downvote)
      const actions = document.createElement("div");
      actions.classList.add("actions");

      const upvoteBtn = document.createElement("button");
      upvoteBtn.textContent = `Upvote (${post.upvotes || 0})`;
      upvoteBtn.addEventListener("click", () => {
        post.upvotes = (post.upvotes || 0) + 1;
        upvoteBtn.textContent = `Upvote (${post.upvotes})`;
        saveAllPosts();
      });

      const downvoteBtn = document.createElement("button");
      downvoteBtn.textContent = `Downvote (${post.downvotes || 0})`;
      downvoteBtn.addEventListener("click", () => {
        post.downvotes = (post.downvotes || 0) + 1;
        downvoteBtn.textContent = `Downvote (${post.downvotes})`;
        saveAllPosts();
      });

      actions.appendChild(upvoteBtn);
      actions.appendChild(downvoteBtn);

      postElement.appendChild(actions);

      // Reply form
      const replyForm = document.createElement("form");
      replyForm.classList.add("reply-form");

      const replyTextarea = document.createElement("textarea");
      replyTextarea.placeholder = "Write a reply...";
      replyTextarea.required = true;
      replyForm.appendChild(replyTextarea);

      const replySubmit = document.createElement("button");
      replySubmit.textContent = "Reply";
      replyForm.appendChild(replySubmit);

      replyForm.addEventListener("submit", (e) => {
        e.preventDefault();
        const replyText = replyTextarea.value.trim();
        if (replyText) {
          if (!post.replies) post.replies = [];
          post.replies.push(replyText);
          renderReplies(replyList, post.replies);
          replyTextarea.value = "";
          saveAllPosts();
        }
      });

      postElement.appendChild(replyForm);

      // Replies container
      const replyList = document.createElement("div");
      replyList.classList.add("replies");
      postElement.appendChild(replyList);

      // Render existing replies
      if (post.replies && post.replies.length > 0) {
        renderReplies(replyList, post.replies);
      }

      return postElement;
    }

    // Render replies
    function renderReplies(container, replies) {
      container.innerHTML = "";
      replies.forEach(reply => {
        const replyDiv = document.createElement("div");
        replyDiv.classList.add("reply");
        replyDiv.textContent = reply;
        container.appendChild(replyDiv);
      });
    }

    // Store all posts in this array
    let posts = [];

    // Save all posts to Firestore
    function saveAllPosts() {
      const batch = db.batch();
      const postsRef = db.collection("posts");

      // Clear old posts first: to keep simple, we can delete all docs and re-add
      postsRef.get().then(snapshot => {
        const deleteBatch = db.batch();
        snapshot.docs.forEach(doc => {
          deleteBatch.delete(doc.ref);
        });
        return deleteBatch.commit();
      }).then(() => {
        // Add current posts to Firestore
        posts.forEach(post => {
          const docRef = postsRef.doc();
          batch.set(docRef, post);
        });
        return batch.commit();
      }).catch(error => {
        console.error("Error saving posts: ", error);
      });
    }

    // Load posts from Firestore and render
    function loadPosts() {
      db.collection("posts").get().then(snapshot => {
        posts = [];
        discussionContainer.innerHTML = "";
        snapshot.forEach(doc => {
          const postData = doc.data();
          // Normalize missing fields
          postData.upvotes = postData.upvotes || 0;
          postData.downvotes = postData.downvotes || 0;
          postData.replies = postData.replies || [];
          posts.push(postData);
        });

        posts.forEach(post => {
          const postElement = createDiscussionPost(post);
          discussionContainer.appendChild(postElement);
        });
      }).catch(error => {
        console.error("Error loading posts: ", error);
      });
    }

    // On form submit, add a new post
    discussionForm.addEventListener("submit", (e) => {
      e.preventDefault();
      const topic = document.getElementById("topic").value.trim();
      const description = document.getElementById("description").value.trim();

      if (topic && description) {
        const newPost = {
          topic,
          description,
          upvotes: 0,
          downvotes: 0,
          replies: []
        };

        posts.push(newPost);

        const postElement = createDiscussionPost(newPost);
        discussionContainer.appendChild(postElement);

        // Reset form
        discussionForm.reset();

        saveAllPosts();
      }
    });

    // Mobile nav toggle logic
    const navToggle = document.querySelector(".mobile-nav-toggle");
    const navLinks = document.querySelector(".nav-links");

    navToggle.addEventListener("click", () => {
      const visible = navLinks.getAttribute("data-visible") === "true";
      navLinks.setAttribute("data-visible", !visible);
      navToggle.setAttribute("aria-expanded", !visible);
    });

    // Initialize AOS
    AOS.init();

    // Load posts when page loads
    loadPosts();
  </script>
</body>
</html>
