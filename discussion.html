<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Discussion - BinaryTree</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="assets/icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
</head>
<body>
  <nav class="navbar">
    <div class="nav-content">
      <img src="assets/icon.png" alt="small-logo" class="small-logo">
      <a href="index.html" class="nav-logo">BinaryTree</a>
      <button class="mobile-nav-toggle" aria-controls="primary-navigation" aria-expanded="false">
        <svg class="icon-hamburger" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
        <svg class="icon-close" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
        <span class="sr-only">Menu</span>
      </button>
      <div class="nav-links" data-visible="false">
        <a href="index.html">Home</a>
        <a href="mission.html">Mission</a>
        <a href="team.html">Team</a>
        <a href="ide.html">Python IDE</a>
        <a href="ai-chat.html">AI Chat</a>
        <a href="discussion.html">Discussion</a>
      </div>
    </div>
  </nav>

  <main class="discussion-board content">
    <section class="section" id="discussion">
      <h1 data-aos="fade-down">Discussion Board</h1>
      <form class="discussion-form" id="postForm">
        <input type="text" id="topic" placeholder="Topic Heading" required />
        <textarea id="description" rows="4" placeholder="Topic Description" required></textarea>
        <button type="submit">Post Topic</button>
      </form>
      <div id="discussionContainer"></div>
    </section>
  </main>

  <footer>
    <div class="footer-content" data-aos="fade-up">
      <p>&copy; 2025 BinaryTree. All rights reserved.</p>
    </div>
  </footer>

  <script>
    AOS.init({ duration: 800, once: true, offset: 100 });

    const form = document.getElementById('postForm');
    const container = document.getElementById('discussionContainer');

    function loadPosts() {
      const posts = JSON.parse(localStorage.getItem('discussionPosts')) || [];
      posts.forEach(data => addPostToDOM(data.topic, data.description));
    }

    function savePosts() {
      const posts = [];
      container.querySelectorAll('.discussion-post').forEach(post => {
        const topic = post.querySelector('h3').textContent;
        const desc = post.querySelector('p').textContent;
        posts.push({ topic, description: desc });
      });
      localStorage.setItem('discussionPosts', JSON.stringify(posts));
    }

    function showPopup(message) {
      const popup = document.createElement('div');
      popup.textContent = message;
      popup.style.position = 'fixed';
      popup.style.bottom = '2rem';
      popup.style.right = '2rem';
      popup.style.background = 'var(--primary)';
      popup.style.color = 'white';
      popup.style.padding = '1rem 1.5rem';
      popup.style.borderRadius = 'var(--radius-lg)';
      popup.style.boxShadow = 'var(--shadow-lg)';
      popup.style.zIndex = 9999;
      popup.style.transition = 'opacity 0.5s ease';
      document.body.appendChild(popup);
      setTimeout(() => {
        popup.style.opacity = '0';
        setTimeout(() => popup.remove(), 500);
      }, 1500);
    }

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      const topic = document.getElementById('topic').value;
      const description = document.getElementById('description').value;
      addPostToDOM(topic, description);
      savePosts();
      form.reset();
      showPopup("Topic submitted!");
    });

    function addPostToDOM(topic, description) {
      const post = document.createElement('div');
      post.className = 'discussion-post';
      post.innerHTML = `
        <h3 class="editable" contenteditable="false">${topic}</h3>
        <p class="editable" contenteditable="false">${description}</p>
        <div class="actions">
          <button onclick="toggleEdit(this)">Edit</button>
          <button onclick="deletePost(this)">Delete</button>
          <button onclick="toggleReply(this)">Reply</button>
        </div>
        <div class="reply-form" style="display:none;">
          <textarea placeholder="Write your reply..."></textarea>
          <button onclick="submitReply(this)">Submit</button>
        </div>
        <div class="replies"></div>
      `;
      container.prepend(post);
    }

    function deletePost(btn) {
      if (confirm("Are you sure you want to delete this post?")) {
        btn.closest('.discussion-post').remove();
        savePosts();
      }
    }

    function toggleEdit(btn) {
      const post = btn.closest('.discussion-post');
      const topic = post.querySelector('h3');
      const desc = post.querySelector('p');
      const isEditing = topic.contentEditable === "true";
      if (isEditing) {
        topic.contentEditable = "false";
        desc.contentEditable = "false";
        btn.textContent = "Edit";
        savePosts();
      } else {
        topic.contentEditable = "true";
        desc.contentEditable = "true";
        topic.focus();
        btn.textContent = "Save";
      }
    }

    function toggleReply(btn) {
      const form = btn.closest('.discussion-post').querySelector('.reply-form');
      form.style.display = form.style.display === 'none' ? 'block' : 'none';
    }

    function submitReply(btn) {
      const form = btn.closest('.reply-form');
      const text = form.querySelector('textarea').value;
      if (!text.trim()) return;
      const reply = document.createElement('div');
      reply.className = 'reply';
      reply.textContent = text;
      form.nextElementSibling.appendChild(reply);
      form.querySelector('textarea').value = '';
      form.style.display = 'none';
      showPopup("Reply submitted!");
    }

    loadPosts();
  </script>
</body>
</html>
