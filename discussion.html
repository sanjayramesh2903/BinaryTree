<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Discussion - BinaryTree</title>
  <link rel="icon" href="assets/icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>

  <style>
    :root {
      --primary: #3a86ff;
      --secondary: #8338ec;
      --accent: #ff006e;
      --background: #f8f9fa;
      --text: #1a1a1a;
      --radius-lg: 0.75rem;
      --shadow-lg: 0 10px 20px rgba(0, 0, 0, 0.15);
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Outfit', sans-serif;
      background-color: var(--background);
      margin: 0;
      padding: 0;
      color: var(--text);
    }

    .navbar {
      background-color: white;
      padding: 1rem 2rem;
      box-shadow: var(--shadow-lg);
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .nav-content {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .nav-logo {
      font-weight: 700;
      font-size: 1.5rem;
      color: var(--primary);
      text-decoration: none;
    }

    .small-logo {
      width: 40px;
      margin-right: 1rem;
    }

    .nav-links {
      display: flex;
      gap: 1rem;
    }

    .nav-links a {
      text-decoration: none;
      color: var(--text);
      font-weight: 500;
    }

    .mobile-nav-toggle {
      display: none;
      background: none;
      border: none;
    }

    .discussion-board {
      padding: 2rem;
      max-width: 800px;
      margin: auto;
    }

    .section h1 {
      text-align: center;
      font-size: 2.5rem;
      margin-bottom: 2rem;
    }

    .discussion-form {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .discussion-form input,
    .discussion-form textarea {
      padding: 1rem;
      border-radius: var(--radius-lg);
      border: 1px solid #ccc;
      font-family: 'Outfit', sans-serif;
      font-size: 1rem;
    }

    .discussion-form button {
      padding: 1rem;
      background: var(--primary);
      color: white;
      font-weight: 600;
      border: none;
      border-radius: var(--radius-lg);
      cursor: pointer;
    }

    .discussion-post {
      background: white;
      padding: 1rem;
      margin-bottom: 1rem;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
    }

    .discussion-post h3 {
      margin: 0 0 0.5rem;
      font-size: 1.25rem;
      color: var(--secondary);
    }

    .discussion-post p {
      margin: 0 0 1rem;
    }

    .discussion-post .actions {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 0.5rem;
    }

    .discussion-post .actions button {
      padding: 0.5rem 1rem;
      border: none;
      background-color: var(--accent);
      color: white;
      font-weight: 600;
      border-radius: var(--radius-lg);
      cursor: pointer;
    }

    .discussion-post .reply-form textarea {
      width: 100%;
      padding: 0.75rem;
      border-radius: var(--radius-lg);
      border: 1px solid #ccc;
      margin-bottom: 0.5rem;
      resize: vertical;
    }

    .discussion-post .reply-form button {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 0.5rem 1rem;
      font-weight: 600;
      border-radius: var(--radius-lg);
    }

    .replies {
      margin-top: 1rem;
      padding-left: 1rem;
      border-left: 2px solid var(--primary);
    }

    .reply {
      margin-bottom: 0.5rem;
      padding: 0.5rem;
      background: #f1f3f5;
      border-radius: var(--radius-lg);
    }

    footer {
      padding: 2rem;
      background-color: white;
      text-align: center;
      box-shadow: 0 -5px 10px rgba(0, 0, 0, 0.05);
      margin-top: 2rem;
    }

    footer p {
      margin: 0;
      font-weight: 400;
      color: #666;
    }

    @media (max-width: 768px) {
      .nav-links {
        display: none;
        flex-direction: column;
        gap: 1rem;
        background: white;
        position: absolute;
        top: 60px;
        right: 2rem;
        padding: 1rem;
        box-shadow: var(--shadow-lg);
      }

      .nav-links[data-visible="true"] {
        display: flex;
      }

      .mobile-nav-toggle {
        display: block;
      }
    }
  </style>
</head>
<body>

  <nav class="navbar">
    <div class="nav-content">
      <img src="assets/icon.png" alt="small-logo" class="small-logo">
      <a href="index.html" class="nav-logo">BinaryTree</a>
      <button class="mobile-nav-toggle" aria-controls="primary-navigation" aria-expanded="false">
        <svg class="icon-hamburger" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        <svg class="icon-close" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        <span class="sr-only">Menu</span>
      </button>
      <div class="nav-links" data-visible="false">
        <a href="index.html">Home</a>
        <a href="mission.html">Mission</a>
        <a href="team.html">Team</a>
        <a href="ide.html">Python IDE</a>
        <a href="ai-chat.html">AI Chat</a>
        <a href="discussion.html">Discussion</a>
      </div>
    </div>
  </nav>

  <main class="discussion-board content">
    <section class="section" id="discussion">
      <h1 data-aos="fade-down">Discussion Board</h1>
      <form class="discussion-form" id="postForm">
        <input type="text" id="topic" placeholder="Topic Heading" required />
        <textarea id="description" rows="4" placeholder="Topic Description" required></textarea>
        <button type="submit">Post Topic</button>
      </form>
      <div id="discussionContainer"></div>
    </section>
  </main>

  <footer>
    <div class="footer-content" data-aos="fade-up">
      <p>&copy; 2025 BinaryTree. All rights reserved.</p>
    </div>
  </footer>

  <script>
    AOS.init({ duration: 800, once: true, offset: 100 });

    const form = document.getElementById('postForm');
    const container = document.getElementById('discussionContainer');

    function loadPosts() {
      const posts = JSON.parse(localStorage.getItem('discussionPosts')) || [];
      posts.forEach(data => addPostToDOM(data.topic, data.description));
    }

    function savePosts() {
      const posts = [];
      container.querySelectorAll('.discussion-post').forEach(post => {
        const topic = post.querySelector('h3').textContent;
        const desc = post.querySelector('p').textContent;
        posts.push({ topic, description: desc });
      });
      localStorage.setItem('discussionPosts', JSON.stringify(posts));
    }

    function showPopup(message) {
      const popup = document.createElement('div');
      popup.textContent = message;
      popup.style.position = 'fixed';
      popup.style.bottom = '2rem';
      popup.style.right = '2rem';
      popup.style.background = 'var(--primary)';
      popup.style.color = 'white';
      popup.style.padding = '1rem 1.5rem';
      popup.style.borderRadius = 'var(--radius-lg)';
      popup.style.boxShadow = 'var(--shadow-lg)';
      popup.style.zIndex = 9999;
      popup.style.transition = 'opacity 0.5s ease';
      document.body.appendChild(popup);
      setTimeout(() => {
        popup.style.opacity = '0';
        setTimeout(() => popup.remove(), 500);
      }, 1500);
    }

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      const topic = document.getElementById('topic').value;
      const description = document.getElementById('description').value;
      addPostToDOM(topic, description);
      savePosts();
      form.reset();
      showPopup("Topic submitted!");
    });

    function addPostToDOM(topic, description) {
      const post = document.createElement('div');
      post.className = 'discussion-post';
      post.innerHTML = `
        <h3 class="editable" contenteditable="false">${topic}</h3>
        <p class="editable" contenteditable="false">${description}</p>
        <div class="actions">
          <button onclick="toggleEdit(this)">Edit</button>
          <button onclick="deletePost(this)">Delete</button>
          <button onclick="toggleReply(this)">Reply</button>
        </div>
        <div class="reply-form" style="display:none;">
          <textarea placeholder="Write your reply..."></textarea>
          <button onclick="submitReply(this)">Submit</button>
        </div>
        <div class="replies"></div>
      `;
      container.prepend(post);
    }

    function deletePost(btn) {
      if (confirm("Are you sure you want to delete this post?")) {
        btn.closest('.discussion-post').remove();
        savePosts();
      }
    }

    function toggleEdit(btn) {
      const post = btn.closest('.discussion-post');
      const topic = post.querySelector('h3');
      const desc = post.querySelector('p');
      const isEditing = topic.contentEditable === "true";
      if (isEditing) {
        topic.contentEditable = "false";
        desc.contentEditable = "false";
        btn.textContent = "Edit";
        savePosts();
      } else {
        topic.contentEditable = "true";
        desc.contentEditable = "true";
        topic.focus();
        btn.textContent = "Save";
      }
    }

    function toggleReply(btn) {
      const form = btn.closest('.discussion-post').querySelector('.reply-form');
      form.style.display = form.style.display === 'none' ? 'block' : 'none';
    }

    function submitReply(btn) {
      const form = btn.closest('.reply-form');
      const text = form.querySelector('textarea').value;
      if (!text.trim()) return;
      const reply = document.createElement('div');
      reply.className = 'reply';
      reply.textContent = text;
      form.nextElementSibling.appendChild(reply);
      form.querySelector('textarea').value = '';
      form.style.display = 'none';
      showPopup("Reply submitted!");
    }

    loadPosts();
  </script>
</body>
</html>
