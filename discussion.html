<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Discussion - BinaryTree</title>
  <link rel="icon" href="assets/icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">

  <style>
    :root {
      --primary: #3a86ff;
      --secondary: #8338ec;
      --accent: #ff006e;
      --background: #f8f9fa;
      --text: #1a1a1a;
      --radius-lg: 0.75rem;
      --shadow-lg: 0 10px 20px rgba(0, 0, 0, 0.15);
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Outfit', sans-serif;
      background-color: var(--background);
      margin: 0;
      padding: 0;
      color: var(--text);
    }

    .navbar {
      background-color: white;
      padding: 1rem 2rem;
      box-shadow: var(--shadow-lg);
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .nav-content {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .nav-logo {
      font-weight: 700;
      font-size: 1.5rem;
      color: var(--primary);
      text-decoration: none;
    }

    .small-logo {
      width: 40px;
      margin-right: 1rem;
    }

    .nav-links {
      display: flex;
      gap: 1rem;
    }

    .nav-links a {
      text-decoration: none;
      color: var(--text);
      font-weight: 500;
      transition: color 0.3s ease;
    }

    .nav-links a:hover {
      color: var(--primary);
    }

    .mobile-nav-toggle {
      display: none;
      background: none;
      border: none;
      cursor: pointer;
    }

    .discussion-board {
      padding: 2rem;
      max-width: 800px;
      margin: auto;
    }

    .section h1 {
      text-align: center;
      font-size: 2.5rem;
      margin-bottom: 2rem;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .discussion-form {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      margin-bottom: 2rem;
      background: white;
      padding: 2rem;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
    }

    .discussion-form input,
    .discussion-form textarea {
      padding: 1rem;
      border-radius: var(--radius-lg);
      border: 2px solid #e0e6ed;
      font-family: 'Outfit', sans-serif;
      font-size: 1rem;
      transition: border-color 0.3s ease;
    }

    .discussion-form input:focus,
    .discussion-form textarea:focus {
      outline: none;
      border-color: var(--primary);
    }

    .discussion-form button {
      padding: 1rem;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: white;
      font-weight: 600;
      border: none;
      border-radius: var(--radius-lg);
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .discussion-form button:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(58, 134, 255, 0.3);
    }

    .discussion-form button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .discussion-post {
      background: white;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      transition: transform 0.2s ease;
    }

    .discussion-post:hover {
      transform: translateY(-2px);
    }

    .discussion-post h3 {
      margin: 0 0 0.5rem;
      font-size: 1.25rem;
      color: var(--secondary);
    }

    .discussion-post p {
      margin: 0 0 1rem;
      line-height: 1.6;
    }

    .post-meta {
      font-size: 0.85rem;
      color: #666;
      margin-bottom: 1rem;
    }

    .discussion-post .actions {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }

    .discussion-post .actions button {
      padding: 0.5rem 1rem;
      border: none;
      background-color: var(--accent);
      color: white;
      font-weight: 600;
      border-radius: var(--radius-lg);
      cursor: pointer;
      transition: all 0.2s ease;
      font-size: 0.85rem;
    }

    .discussion-post .actions button:hover {
      background-color: #e6005c;
      transform: translateY(-1px);
    }

    .discussion-post .actions button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .discussion-post .reply-form {
      margin-top: 1rem;
    }

    .discussion-post .reply-form textarea {
      width: 100%;
      padding: 0.75rem;
      border-radius: var(--radius-lg);
      border: 2px solid #e0e6ed;
      margin-bottom: 0.5rem;
      resize: vertical;
      font-family: 'Outfit', sans-serif;
      transition: border-color 0.3s ease;
    }

    .discussion-post .reply-form textarea:focus {
      outline: none;
      border-color: var(--primary);
    }

    .discussion-post .reply-form button {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 0.5rem 1rem;
      font-weight: 600;
      border-radius: var(--radius-lg);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .discussion-post .reply-form button:hover {
      background-color: #2a6ff0;
      transform: translateY(-1px);
    }

    .discussion-post .reply-form button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .replies {
      margin-top: 1rem;
      padding-left: 1rem;
      border-left: 3px solid var(--primary);
    }

    .reply {
      margin-bottom: 0.75rem;
      padding: 0.75rem;
      background: #f8f9fa;
      border-radius: var(--radius-lg);
      border-left: 3px solid #e0e6ed;
    }

    .loading {
      text-align: center;
      padding: 2rem;
      color: #666;
    }

    .error {
      background: #ffe6e6;
      color: #d63031;
      padding: 1rem;
      border-radius: var(--radius-lg);
      margin-bottom: 1rem;
      border-left: 4px solid #d63031;
    }

    footer {
      padding: 2rem;
      background-color: white;
      text-align: center;
      box-shadow: 0 -5px 10px rgba(0, 0, 0, 0.05);
      margin-top: 2rem;
    }

    footer p {
      margin: 0;
      font-weight: 400;
      color: #666;
    }

    @media (max-width: 768px) {
      .nav-links {
        display: none;
        flex-direction: column;
        gap: 1rem;
        background: white;
        position: absolute;
        top: 60px;
        right: 2rem;
        padding: 1rem;
        box-shadow: var(--shadow-lg);
        border-radius: var(--radius-lg);
      }

      .nav-links[data-visible="true"] {
        display: flex;
      }

      .mobile-nav-toggle {
        display: block;
      }

      .discussion-board {
        padding: 1rem;
      }

      .section h1 {
        font-size: 2rem;
      }

      .discussion-form {
        padding: 1.5rem;
      }
    }
  </style>
</head>
<body>

  <nav class="navbar">
    <div class="nav-content">
      <img src="assets/icon.png" alt="small-logo" class="small-logo">
      <a href="index.html" class="nav-logo">BinaryTree</a>
      <button class="mobile-nav-toggle" aria-controls="primary-navigation" aria-expanded="false">
        <svg class="icon-hamburger" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        <svg class="icon-close" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        <span class="sr-only">Menu</span>
      </button>
      <div class="nav-links" data-visible="false">
        <a href="index.html">Home</a>
        <a href="mission.html">Mission</a>
        <a href="team.html">Team</a>
        <a href="ide.html">Python IDE</a>
        <a href="ai-chat.html">AI Chat</a>
        <a href="discussion.html">Discussion</a>
      </div>
    </div>
  </nav>

  <main class="discussion-board content">
    <section class="section" id="discussion">
      <h1 data-aos="fade-down">Discussion Board</h1>
      
      <div id="errorContainer"></div>
      
      <form class="discussion-form" id="postForm">
        <input type="text" id="topic" placeholder="Topic Heading" required maxlength="100" />
        <textarea id="description" rows="4" placeholder="Topic Description" required maxlength="500"></textarea>
        <button type="submit" id="submitBtn">Post Topic</button>
      </form>
      
      <div id="loadingContainer" class="loading" style="display: none;">
        Loading discussions...
      </div>
      
      <div id="discussionContainer"></div>
    </section>
  </main>

  <footer>
    <div class="footer-content" data-aos="fade-up">
      <p>&copy; 2025 BinaryTree. All rights reserved.</p>
    </div>
  </footer>

  <!-- External Libraries - Load these first -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-analytics.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>

  <!-- Main Application Script - Load after all libraries -->
  <script>
    // Wait for all external scripts to load before initializing
    window.addEventListener('load', function() {
      // Your Firebase config
      const firebaseConfig = {
        apiKey: "AIzaSyBJs48_Ed_yJkMx9wqBFIinC-m4uf7yEQU",
        authDomain: "discussion-ac97b.firebaseapp.com",
        projectId: "discussion-ac97b",
        storageBucket: "discussion-ac97b.firebasestorage.app",
        messagingSenderId: "828172916370",
        appId: "1:828172916370:web:60758965578789974c384b",
        measurementId: "G-7S2SQNVCYP"
      };

      // Initialize Firebase
      firebase.initializeApp(firebaseConfig);
      firebase.analytics();

      // Initialize Firestore
      const db = firebase.firestore();

      // Initialize AOS
      AOS.init({
        duration: 800,
        easing: 'ease-in-out',
        once: true
      });

      // Get DOM elements
      const discussionForm = document.getElementById("postForm");
      const discussionContainer = document.getElementById("discussionContainer");
      const loadingContainer = document.getElementById("loadingContainer");
      const errorContainer = document.getElementById("errorContainer");
      const submitBtn = document.getElementById("submitBtn");

      // Show error message
      function showError(message) {
        errorContainer.innerHTML = `<div class="error">${message}</div>`;
        setTimeout(() => {
          errorContainer.innerHTML = "";
        }, 5000);
      }

      // Format timestamp
      function formatTimestamp(timestamp) {
        if (!timestamp) return "Just now";
        const date = timestamp.toDate();
        return date.toLocaleString();
      }

      // Helper: Create discussion post element from data object
      function createDiscussionPost(post, docId) {
        const postElement = document.createElement("div");
        postElement.classList.add("discussion-post");
        postElement.setAttribute("data-aos", "fade-up");

        // Main content
        const heading = document.createElement("h3");
        heading.textContent = post.topic;

        const description = document.createElement("p");
        description.textContent = post.description;

        // Post metadata
        const metaDiv = document.createElement("div");
        metaDiv.classList.add("post-meta");
        metaDiv.textContent = `Posted ${formatTimestamp(post.createdAt)}`;

        postElement.appendChild(heading);
        postElement.appendChild(description);
        postElement.appendChild(metaDiv);

        // Actions (upvote, downvote)
        const actions = document.createElement("div");
        actions.classList.add("actions");

        const upvoteBtn = document.createElement("button");
        upvoteBtn.textContent = `👍 ${post.upvotes || 0}`;
        upvoteBtn.addEventListener("click", async () => {
          upvoteBtn.disabled = true;
          try {
            const postRef = db.collection("posts").doc(docId);
            await postRef.update({
              upvotes: firebase.firestore.FieldValue.increment(1)
            });
          } catch (error) {
            console.error("Error upvoting:", error);
            showError("Failed to upvote. Please try again.");
          }
          upvoteBtn.disabled = false;
        });

        const downvoteBtn = document.createElement("button");
        downvoteBtn.textContent = `👎 ${post.downvotes || 0}`;
        downvoteBtn.addEventListener("click", async () => {
          downvoteBtn.disabled = true;
          try {
            const postRef = db.collection("posts").doc(docId);
            await postRef.update({
              downvotes: firebase.firestore.FieldValue.increment(1)
            });
          } catch (error) {
            console.error("Error downvoting:", error);
            showError("Failed to downvote. Please try again.");
          }
          downvoteBtn.disabled = false;
        });

        actions.appendChild(upvoteBtn);
        actions.appendChild(downvoteBtn);
        postElement.appendChild(actions);

        // Reply form
        const replyForm = document.createElement("form");
        replyForm.classList.add("reply-form");

        const replyTextarea = document.createElement("textarea");
        replyTextarea.placeholder = "Write a reply...";
        replyTextarea.required = true;
        replyTextarea.maxLength = 300;
        replyForm.appendChild(replyTextarea);

        const replySubmit = document.createElement("button");
        replySubmit.textContent = "Reply";
        replyForm.appendChild(replySubmit);

        replyForm.addEventListener("submit", async (e) => {
          e.preventDefault();
          const replyText = replyTextarea.value.trim();
          if (replyText) {
            replySubmit.disabled = true;
            replySubmit.textContent = "Posting...";
            
            try {
              const postRef = db.collection("posts").doc(docId);
              const replyData = {
                text: replyText,
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
              };
              await postRef.update({
                replies: firebase.firestore.FieldValue.arrayUnion(replyData)
              });
              replyTextarea.value = "";
            } catch (error) {
              console.error("Error adding reply:", error);
              showError("Failed to add reply. Please try again.");
            }
            
            replySubmit.disabled = false;
            replySubmit.textContent = "Reply";
          }
        });

        postElement.appendChild(replyForm);

        // Replies container
        const replyList = document.createElement("div");
        replyList.classList.add("replies");
        postElement.appendChild(replyList);

        // Render existing replies
        if (post.replies && post.replies.length > 0) {
          renderReplies(replyList, post.replies);
        }

        return postElement;
      }

      // Render replies
      function renderReplies(container, replies) {
        container.innerHTML = "";
        replies.forEach(reply => {
          const replyDiv = document.createElement("div");
          replyDiv.classList.add("reply");
          
          // Handle both old string replies and new object replies
          if (typeof reply === 'string') {
            replyDiv.textContent = reply;
          } else {
            replyDiv.innerHTML = `
              <div>${reply.text}</div>
              <small style="color: #666; font-size: 0.8em;">${formatTimestamp(reply.timestamp)}</small>
            `;
          }
          
          container.appendChild(replyDiv);
        });
      }

      // Listen for real-time updates
      function setupRealTimeListener() {
        loadingContainer.style.display = "block";
        
        const unsubscribe = db.collection("posts")
          .orderBy("createdAt", "desc")
          .onSnapshot(snapshot => {
            loadingContainer.style.display = "none";
            discussionContainer.innerHTML = "";
            
            if (snapshot.empty) {
              discussionContainer.innerHTML = `
                <div style="text-align: center; padding: 2rem; color: #666;">
                  <h3>No discussions yet</h3>
                  <p>Be the first to start a discussion!</p>
                </div>
              `;
              return;
            }
            
            snapshot.forEach(doc => {
              const postData = doc.data();
              postData.upvotes = postData.upvotes || 0;
              postData.downvotes = postData.downvotes || 0;
              postData.replies = postData.replies || [];
              const postElement = createDiscussionPost(postData, doc.id);
              discussionContainer.appendChild(postElement);
            });
            
            // Refresh AOS animations for new elements
            AOS.refresh();
          }, error => {
            loadingContainer.style.display = "none";
            console.error("Error loading posts:", error);
            showError("Failed to load discussions. Please refresh the page.");
          });
        
        return unsubscribe;
      }

      // On form submit, add a new post
      discussionForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        const topic = document.getElementById("topic").value.trim();
        const description = document.getElementById("description").value.trim();

        if (topic && description) {
          submitBtn.disabled = true;
          submitBtn.textContent = "Posting...";
          
          try {
            const newPost = {
              topic,
              description,
              upvotes: 0,
              downvotes: 0,
              replies: [],
              createdAt: firebase.firestore.FieldValue.serverTimestamp()
            };

            await db.collection("posts").add(newPost);
            discussionForm.reset();
          } catch (error) {
            console.error("Error adding post:", error);
            showError("Failed to post topic. Please try again.");
          }
          
          submitBtn.disabled = false;
          submitBtn.textContent = "Post Topic";
        }
      });

      // Mobile nav toggle logic
      const navToggle = document.querySelector(".mobile-nav-toggle");
      const navLinks = document.querySelector(".nav-links");

      if (navToggle && navLinks) {
        navToggle.addEventListener("click", () => {
          const visible = navLinks.getAttribute("data-visible") === "true";
          navLinks.setAttribute("data-visible", !visible);
          navToggle.setAttribute("aria-expanded", !visible);
        });
      }

      // Initialize the real-time listener
      setupRealTimeListener();
    });
  </script>
</body>
</html>
