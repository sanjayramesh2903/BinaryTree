<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BinaryTree - Empowering Digital Education</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link rel="icon" href="assets/icon.png">
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
</head>
<body>
    <nav class="navbar">
        <div class="nav-content">
            <img src = assets/icon.png alt = "small-logo" class = "small-logo">
            <a href="index.html" class="nav-logo">BinaryTree</a>
            <button class="mobile-nav-toggle" aria-controls="primary-navigation" aria-expanded="false">
                <svg class="icon-hamburger" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="3" y1="12" x2="21" y2="12"></line>
                    <line x1="3" y1="6" x2="21" y2="6"></line>
                    <line x1="3" y1="18" x2="21" y2="18"></line>
                </svg>
                <svg class="icon-close" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
                <span class="sr-only">Menu</span>
            </button>
            <div class="nav-links" data-visible="false">
                <a href="mission.html">Mission</a>
                <a href="#why">Why Us</a>
                <a href="partners.html">Partners<
                <a href="team.html">Team</a>
                <a href="ide.html">Python IDE</a>
                <a href="ai-chat.html">AI Chat</a>
                <a href="#contact">Contact</a>
            </div>
        </div>
    </nav>

    <main>
       
    </main>

    <footer>
        <div class="footer-content" data-aos="fade-up">
            <p>&copy; 2025 BinaryTree. All rights reserved.</p>
        </div>
    </footer>

    <script>
        window.addEventListener('scroll', () => {
            const navbar = document.querySelector('.navbar');
            if (window.scrollY > 50) {
                navbar.classList.add('scrolled');
            } else {
                navbar.classList.remove('scrolled');
            }
        });
    </script>
    <script>
        AOS.init({
            duration: 800,
            once: true,
            offset: 100
        });
    </script>
    <script>
        const primaryNav = document.querySelector('.nav-links');
        const navToggle = document.querySelector('.mobile-nav-toggle');
        const navbar = document.querySelector('.navbar'); // Get the navbar element

        navToggle.addEventListener('click', () => {
            const visibility = primaryNav.getAttribute('data-visible');

            if (visibility === "false" || visibility === null) {
                primaryNav.setAttribute('data-visible', true);
                navToggle.setAttribute('aria-expanded', true);
                navbar.classList.add('nav-open'); // Add class to navbar
                document.body.classList.add('menu-open'); // Add class to body
            } else {
                primaryNav.setAttribute('data-visible', false);
                navToggle.setAttribute('aria-expanded', false);
                navbar.classList.remove('nav-open'); // Remove class from navbar
                document.body.classList.remove('menu-open'); // Remove class from body
            }
        });

        // Close menu when a link is clicked (optional but good UX)
        primaryNav.querySelectorAll('a').forEach(link => {
            link.addEventListener('click', () => {
                if (primaryNav.getAttribute('data-visible') === "true") {
                    primaryNav.setAttribute('data-visible', false);
                    navToggle.setAttribute('aria-expanded', false);
                    navbar.classList.remove('nav-open');
                    document.body.classList.remove('menu-open'); // Remove class from body
                }
            });
        });
    </script>
</body>
</html>
