<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTML, CSS, JS Example</title>
  <style>
    /* CSS: Styles the look of the page */
    body {
      font-family: Arial, sans-serif;
      background-color: #f0f4f8;
      text-align: center;
      padding: 50px;
    }
    h1 {
      color: #333;
    }
    p {
      color: #555;
      font-size: 1.2em;
    }
    button {
      background-color: #4CAF50;
      color: white;
      border: none;
      padding: 10px 20px;
      font-size: 1em;
      cursor: pointer;
      border-radius: 5px;
      transition: background-color 0.3s ease;
    }
    button:hover {
      background-color: #45a049;
    }
  </style>
</head>
<body>
  <!-- HTML: Structure and content -->
  <h1>Hello, World!</h1>
  <p id="message">Click the button to change this message.</p>
  <button onclick="changeMessage()">Click Me</button>

  <script>
    // JavaScript: Adds interactivity and behavior
    function changeMessage() {
      const messageElement = document.getElementById('message');
      messageElement.textContent = "You clicked the button! JavaScript changed this text.";
      messageElement.style.color = "darkblue"; // change text color with JS
    }
  </script>
</body>
</html>
