<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python IDE - BinaryTree</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="ide.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/theme/dracula.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link rel="icon" href="assets/icon.png">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/python/python.min.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
</head>
<body>
    <div id="navbar-container"></div>

    <main class="ide-container">
        <h1 data-aos="fade-down">Python IDE</h1>
        <div class="ide-wrapper" data-aos="fade-up" data-aos-delay="100" data-aos-duration="600">
            <div class="filename-container" data-aos="fade-up" data-aos-delay="150">
                <label for="filename-input">File Name:</label>
                <input type="text" id="filename-input" placeholder="filename.py" value="code.py">
            </div>
            <div class="editor-container">
                <textarea id="code-editor">print("Hello, World!")</textarea>
            </div>
            <div class="controls" data-aos="fade-up" data-aos-delay="200">
                <button id="run-btn">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                        <path d="M4 2l8 6-8 6V2z" fill="currentColor"/>
                    </svg>
                    Run Code
                </button>
                <button id="save-btn">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                        <path d="M13 0H0v16h16V3L13 0zM8 2h3v3H8V2zM2 2h4v4h8v8H2V2z" fill="currentColor"/>
                    </svg>
                    Save
                </button>
                <button id="download-btn">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                        <path d="M8 12l-4-4h2.5V2h3v6H12L8 12z" fill="currentColor"/>
                        <path d="M14 14H2v-4h2v2h8v-2h2v4z" fill="currentColor"/>
                    </svg>
                    Download
                </button>
                <button id="import-btn">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                        <path d="M8 4l4 4h-2.5v6h-3V8H4l4-4z" fill="currentColor"/>
                        <path d="M14 2H2v4h2V4h8v2h2V2z" fill="currentColor"/>
                    </svg>
                    Import
                </button>
                <button id="clear-btn">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                        <path d="M2 4h12M6 4V2h4v2M4 4v10h8V4" stroke="currentColor" stroke-width="2"/>
                    </svg>
                    Clear
                </button>
                <input type="file" id="file-input" accept=".py" style="display: none;">
            </div>
            <div class="output-container" data-aos="fade-up" data-aos-delay="300">
                <h3>Output:</h3>
                <pre id="output"></pre>
                <div id="input-container" class="input-container" style="display: none;">
                    <input type="text" id="user-input" placeholder="Enter your input here..." autocomplete="off">
                    <button id="submit-input">Submit</button>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <div class="footer-content" data-aos="fade-up">
            <p>&copy; 2025 BinaryTree. All rights reserved.</p>
        </div>
    </footer>

    <script>
        fetch('navbar.html')
      .then(res => res.text())
      .then(data => {
        document.getElementById('navbar-container').innerHTML = data;
        
        // Initialize mobile menu with a simple approach
        setTimeout(function() {
            const toggle = document.getElementById('mobileMenuToggle');
            const menu = document.getElementById('navLinks');
            const overlay = document.getElementById('mobileMenuOverlay');
            
            if (toggle && menu && overlay) {
                console.log('Mobile menu elements found successfully');
                
                // Toggle menu function
                function toggleMenu() {
                    const isOpen = menu.classList.contains('show');
                    
                    if (isOpen) {
                        // Close menu
                        menu.classList.remove('show');
                        overlay.classList.remove('show');
                        toggle.classList.remove('active');
                        document.body.style.overflow = '';
                        console.log('Menu closed');
                    } else {
                        // Open menu
                        menu.classList.add('show');
                        overlay.classList.add('show');
                        toggle.classList.add('active');
                        document.body.style.overflow = 'hidden';
                        console.log('Menu opened');
                    }
                }
                
                // Close menu function
                function closeMenu() {
                    menu.classList.remove('show');
                    overlay.classList.remove('show');
                    toggle.classList.remove('active');
                    document.body.style.overflow = '';
                    console.log('Menu closed');
                }
                
                // Add event listeners
                toggle.addEventListener('click', function(e) {
                    e.preventDefault();
                    console.log('Toggle button clicked');
                    toggleMenu();
                });
                
                overlay.addEventListener('click', closeMenu);
                
                // Close menu when clicking nav links
                const navLinks = menu.querySelectorAll('a');
                navLinks.forEach(link => {
                    link.addEventListener('click', closeMenu);
                });
                
                // Close menu on window resize
                window.addEventListener('resize', function() {
                    if (window.innerWidth > 768) {
                        closeMenu();
                    }
                });
                
                console.log('Mobile menu initialized successfully');
            } else {
                console.log('Mobile menu elements not found');
            }
        }, 300);
      });
        
        // Initialize AOS first - with shorter durations
        AOS.init({
            duration: 600,
            once: true,
            offset: 100,
            disable: window.innerWidth < 768 // Disable on mobile for better performance
        });
        
        // Force CodeMirror to refresh when animations complete
        document.addEventListener('aos:in:editor-container', function() {
            if (window.editor) {
                setTimeout(function() {
                    window.editor.refresh();
                }, 100);
            }
        });
    </script>
    <script src="ide.js"></script>
</body>
</html>
