<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chat - BinaryTree</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="ai-chat.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <link rel="icon" href="assets/icon.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/atom-one-dark.min.css">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.0.2/marked.min.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
</head>
<body>
    <div id="navbar-container"></div>

    <main class="chat-container">
        <h1 data-aos="fade-down">AI Coding Assistant</h1>
        <div class="chat-wrapper" data-aos="fade-up" data-aos-delay="200">
            <div class="chat-messages" id="chat-messages" data-aos="fade-right" data-aos-delay="300">
                <div class="message assistant" data-aos="fade-up" data-aos-delay="400">
                    <div class="message-content">
                        Hello! I'm your coding assistant. How can I help you today?
                    </div>
                </div>
            </div>
            <div class="chat-input" data-aos="fade-up" data-aos-delay="500">
                <textarea id="user-input" placeholder="Ask me anything about coding..."></textarea>
                <button id="send-btn" data-aos="zoom-in" data-aos-delay="600">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                        <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>
            </div>
        </div>
    </main>

    <footer>
        <div class="footer-content" data-aos="fade-up">
            <p>&copy; 2025 BinaryTree. All rights reserved.</p>
        </div>
    </footer>

    <script src="ai-chat.js"></script>
    <script>
        fetch('navbar.html')
      .then(res => res.text())
      .then(data => {
        document.getElementById('navbar-container').innerHTML = data;
        
        // Initialize mobile menu with a simple approach
        setTimeout(function() {
            const toggle = document.getElementById('mobileMenuToggle');
            const menu = document.getElementById('navLinks');
            const overlay = document.getElementById('mobileMenuOverlay');
            
            if (toggle && menu && overlay) {
                console.log('Mobile menu elements found successfully');
                
                // Toggle menu function
                function toggleMenu() {
                    const isOpen = menu.classList.contains('show');
                    
                    if (isOpen) {
                        // Close menu
                        menu.classList.remove('show');
                        overlay.classList.remove('show');
                        toggle.classList.remove('active');
                        document.body.style.overflow = '';
                        console.log('Menu closed');
                    } else {
                        // Open menu
                        menu.classList.add('show');
                        overlay.classList.add('show');
                        toggle.classList.add('active');
                        document.body.style.overflow = 'hidden';
                        console.log('Menu opened');
                    }
                }
                
                // Close menu function
                function closeMenu() {
                    menu.classList.remove('show');
                    overlay.classList.remove('show');
                    toggle.classList.remove('active');
                    document.body.style.overflow = '';
                    console.log('Menu closed');
                }
                
                // Add event listeners
                toggle.addEventListener('click', function(e) {
                    e.preventDefault();
                    console.log('Toggle button clicked');
                    toggleMenu();
                });
                
                overlay.addEventListener('click', closeMenu);
                
                // Close menu when clicking nav links
                const navLinks = menu.querySelectorAll('a');
                navLinks.forEach(link => {
                    link.addEventListener('click', closeMenu);
                });
                
                // Close menu on window resize
                window.addEventListener('resize', function() {
                    if (window.innerWidth > 768) {
                        closeMenu();
                    }
                });
                
                console.log('Mobile menu initialized successfully');
            } else {
                console.log('Mobile menu elements not found');
            }
        }, 300);
      });
        
        // Initialize AOS
        AOS.init({
            duration: 800,
            once: true,
            offset: 100
        });
    </script>
</body>
</html>
